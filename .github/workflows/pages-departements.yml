name: Pages département

# Régénère les pages /departement/<slug>/ (chiffres, carte centrée, voisins) + l'annuaire
# et le sitemap. Se déclenche juste après chaque relevé (pour des chiffres à jour), quand le
# gabarit change (index.html) ou à la main via "Run workflow".
on:
  workflow_run:
    workflows: ["Relevé des ruptures (toutes les 3 h)"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "index.html"
      - "departements.js"
      - "scripts/pages.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pages:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Générer les pages département
        run: python scripts/pages.py
      - name: Installer Playwright (images de partage)
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Générer les images de partage par département
        run: python scripts/og_departements.py
      - name: Enregistrer
        run: |
          git config user.name "pages-bot"
          git config user.email "pages-bot@users.noreply.github.com"
          git add departement sitemap.xml
          git diff --cached --quiet || git commit -m "Pages département : mise à jour du $(date -u +%F\ %H:%M) UTC"
          git pull --rebase --autostash || true
          git push
