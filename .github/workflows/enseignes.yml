name: Noms des stations (chaque semaine)

on:
  schedule:
    - cron: "17 4 * * 1"     # le lundi vers 6 h (heure de Paris)
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  enseignes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Noms et enseignes depuis OpenStreetMap
        run: python scripts/enseignes.py --out enseignes.json
      - name: Enregistrer
        run: |
          git config user.name "releve-bot"
          git config user.email "releve-bot@users.noreply.github.com"
          git add enseignes.json
          git diff --cached --quiet || git commit -m "Noms des stations (OpenStreetMap)"
          git pull --rebase --autostash || true
          git push
