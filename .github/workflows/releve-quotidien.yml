name: Relevé des ruptures (toutes les 3 h)

on:
  schedule:
    - cron: "5 */3 * * *"    # toutes les 3 h (0 h 05, 3 h 05, 6 h 05… UTC) ; GitHub peut décaler de quelques minutes
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  releve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Relevé du jour
        run: python scripts/snapshot.py --out historique.json --out3h releves-3h.json
      - name: Enregistrer
        run: |
          git config user.name "releve-bot"
          git config user.email "releve-bot@users.noreply.github.com"
          git add historique.json releves-3h.json
          git diff --cached --quiet || git commit -m "Relevé du $(date -u +%F\ %H:%M) UTC"
          git pull --rebase --autostash || true
          git push
