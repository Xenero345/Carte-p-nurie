<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Pénurie d'essence</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0f1115">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--text:#16181d;--muted:#5d6470;--border:#e1e4ea;--accent:#1f6feb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--surface:#171a21;--text:#e8eaef;--muted:#9aa2b1;--border:#2a2f3a;--accent:#58a6ff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.card{max-width:480px;text-align:center}
.pump{font-size:52px;line-height:1}
h1{font-size:22px;margin:14px 0 8px}
p{color:var(--muted);margin:0 0 22px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{display:inline-block;padding:10px 18px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#suggestion{margin-top:18px;font-size:14.5px}
</style>
</head>
<body>
<div class="card">
  <div class="pump">⛽</div>
  <h1>Cette page n'existe pas (ou plus)</h1>
  <p>Le lien est peut-être mal orthographié ou obsolète. La carte des pénuries et toutes les pages département restent accessibles ci-dessous.</p>
  <div class="actions">
    <a class="btn primary" href="/">Carte de France entière</a>
    <a class="btn" href="/departement/">Tous les départements</a>
  </div>
  <div id="suggestion"></div>
</div>
<script>
// Si l'URL ressemble à /departement/<quelque-chose>, propose le lien vers l'annuaire ciblé
// sur ce nom-là, au cas où c'est juste une orthographe de slug qui a changé.
(function () {
  var m = location.pathname.match(/^\/departement\/([^/]+)\/?/);
  if (!m) return;
  document.getElementById("suggestion").innerHTML =
    'Vous cherchiez la page du département « ' + decodeURIComponent(m[1]).replace(/-/g, " ") +
    ' » ? Elle est peut-être listée sous un autre nom dans <a href="/departement/">l\'annuaire complet</a>.';
})();
</script>
</body>
</html>
